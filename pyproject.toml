[project]
name = "ai-hub"
version = "0.0.1"
description = "One command. Multiple AI providers. Free-first routing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "mcp>=1,<2",
]

[project.scripts]
ai-hub = "cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
    "live: marks tests as requiring live providers (deselect with '-m \"not live\"')",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "router*",
    "cli*",
    "planner*",
    "providers*",
    "adapters*",
    "scripts*",
]
